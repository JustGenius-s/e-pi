<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">E-Pi</title>
  <desc id="desc">An interlocked monogram combining an open e ribbon with pi.</desc>
  <defs>
    <linearGradient id="eRibbon" x1="40" y1="48" x2="205" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9be7ff"/>
      <stop offset="0.46" stop-color="#42b9ff"/>
      <stop offset="1" stop-color="#4d67ff"/>
    </linearGradient>
    <linearGradient id="piMetal" x1="82" y1="62" x2="176" y2="197" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#e8edf5"/>
      <stop offset="1" stop-color="#aeb9ca"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#07101f" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- The open curve defines the body of the e and sits behind pi. -->
  <path
    d="M199 73C181 49 151 36 119 39 72 43 38 81 40 128c2 47 38 84 85 87 34 2 64-13 82-39"
    fill="none"
    stroke="url(#eRibbon)"
    stroke-width="24"
    stroke-linecap="round"
  />
  <path
    d="M192 68C173 49 148 42 121 44"
    fill="none"
    stroke="#d8f5ff"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.6"
  />

  <!-- The pi bridge rises through the orbit. -->
  <g fill="none" stroke="url(#piMetal)" stroke-width="20" stroke-linecap="round" filter="url(#lift)">
    <path d="M82 79h105"/>
    <path d="M108 80v112M165 80v112"/>
  </g>

  <!-- The e crossbar passes in front, completing the interlock. -->
  <path d="M52 130h145" fill="none" stroke="#08111f" stroke-width="30" stroke-linecap="round" opacity="0.9"/>
  <path d="M52 130h145" fill="none" stroke="url(#eRibbon)" stroke-width="22" stroke-linecap="round"/>
  <path d="M58 126h124" fill="none" stroke="#c9f1ff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Angled terminal cuts give the mark a precise, directional finish. -->
  <path d="M198 73l9-7M207 176l9-5" fill="none" stroke="#8edfff" stroke-width="5" stroke-linecap="round"/>
</svg>
